<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portal de Matías Ignacio Gariglio — Agencia MIHG y Sobre mí.">
<meta name="theme-color" content="#FAFAF5">
<title>Matías — Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23FAFAF5'/><text x='16' y='23' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='20' text-anchor='middle' fill='%2317181B'>M</text></svg>">
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  html{ height:100%; }
  body{
    margin:0; min-height:100svh; min-height:100vh;
    background:#FAFAF5; color:#17181B;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* paper-grain background, drifting very slowly */
  .grain{
    position:absolute; inset:-40px;
    background-image: radial-gradient(rgba(0,0,0,.055) 1px, transparent 1.4px);
    background-size: 22px 22px;
    animation: grainDrift 34s linear infinite;
    pointer-events:none;
  }
  @keyframes grainDrift{ from{ background-position:0 0; } to{ background-position:220px 160px; } }

  .stack{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(20px, 4vw, 34px);
    padding: 24px;
    opacity:0; transform:translateY(14px);
    animation: enter .8s cubic-bezier(.16,1,.3,1) .1s forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:translateY(0); } }

  /* item = blob + a soft radial glow irradiating from behind it,
     colored after the dominant palette of the site it links to */
  .item{ position:relative; display:flex; align-items:center; justify-content:center; }

  .item-col{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .home-mark{ color:#17181B; opacity:.6; }

  .glow{
    position:absolute; top:50%; left:50%; z-index:0; pointer-events:none;
    border-radius:50%;
    filter: blur(34px);
    animation: glowPulse 6s ease-in-out infinite;
  }
  .item--primary .glow{
    width: clamp(220px, 40vw, 380px); height: clamp(220px, 40vw, 380px);
    background: radial-gradient(circle, #FFE9A8 0%, #E4C878 32%, #C9A24B 52%, transparent 72%);
    opacity:.9;
  }
  .item--secondary .glow{
    width: clamp(150px, 28vw, 250px); height: clamp(150px, 28vw, 250px);
    background: radial-gradient(circle, #FF7B6B 0%, #D42B2B 36%, #8a1a1a 56%, transparent 72%);
    opacity:.7;
    animation-delay: .9s;
    animation-duration: 7s;
  }
  @keyframes glowPulse{
    0%,100%{ transform: translate(-50%,-50%) scale(1); }
    50%{      transform: translate(-50%,-50%) scale(1.14); }
  }

  .blob{
    position:relative; z-index:1;
    display:inline-flex; align-items:center; justify-content:center;
    text-decoration:none; color:#17181B; background:#FAFAF5;
    border: 2.5px solid #17181B;
    font-weight:800;
    animation: morph 9s ease-in-out infinite;
    transition: transform .35s cubic-bezier(.16,1,.3,1), border-color .3s ease, background-color .3s ease;
    will-change: border-radius, transform;
  }
  .blob:hover, .blob:focus-visible{
    transform: translateY(-4px) scale(1.03);
    background: #F1F0E9;
  }
  .blob:active{ transform: translateY(-1px) scale(1.01); }
  .blob:focus-visible{ outline: 2.5px dashed #17181B; outline-offset: 8px; }

  .blob--primary{
    padding: clamp(20px,4vw,32px) clamp(38px,7vw,64px);
    font-size: clamp(1.5rem, 5vw, 2.6rem);
  }
  .blob--secondary{
    padding: clamp(10px,2vw,15px) clamp(22px,4vw,32px);
    font-size: clamp(.85rem, 2vw, 1.05rem);
    font-weight:700;
    color: rgba(23,24,27,.55);
    border-color: rgba(23,24,27,.4);
    animation-delay: .6s;
  }
  .blob--secondary:hover, .blob--secondary:focus-visible{
    color: rgba(23,24,27,.85);
    border-color: rgba(23,24,27,.7);
  }

  @keyframes morph{
    0%,100%{ border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; transform: rotate(-1deg); }
    50%{      border-radius: 15px 225px 15px 255px / 225px 15px 255px 15px; transform: rotate(1deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .grain{ animation: none; }
    .stack{ animation: none; opacity:1; transform:none; }
    .blob{ animation: none; border-radius: 40px 12px 36px 12px / 12px 36px 12px 40px; }
    .glow{ animation: none; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<div class="stack">
  <div class="item-col">
    <svg class="home-mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9h13v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="item item--primary">
      <span class="glow" aria-hidden="true"></span>
      <a class="blob blob--primary" href="/agencia-mihg/">Agencia MIHG</a>
    </div>
  </div>
  <div class="item item--secondary">
    <span class="glow" aria-hidden="true"></span>
    <a class="blob blob--secondary" href="/sobre-mi/">Sobre mí</a>
  </div>
</div>

</body>
</html>
